services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      EXECUTION_MODE: ${EXECUTION_MODE:-live}
      DATABASE_PATH: ${DATABASE_PATH:-data/lab.sqlite3}
      DEMO_DATABASE_PATH: ${DEMO_DATABASE_PATH:-data/demo.sqlite3}
      FREE_ONLY: ${FREE_ONLY:-true}
    volumes:
      - app-data:/app/data

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      EXECUTION_MODE: ${EXECUTION_MODE:-live}
      DATABASE_PATH: ${DATABASE_PATH:-data/lab.sqlite3}
      DEMO_DATABASE_PATH: ${DEMO_DATABASE_PATH:-data/demo.sqlite3}
      FREE_ONLY: ${FREE_ONLY:-true}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      EXECUTION_MODE: ${EXECUTION_MODE:-live}
      DATABASE_PATH: ${DATABASE_PATH:-data/lab.sqlite3}
      DEMO_DATABASE_PATH: ${DEMO_DATABASE_PATH:-data/demo.sqlite3}
      FREE_ONLY: ${FREE_ONLY:-true}
    volumes:
      - app-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy

volumes:
  app-data:
